<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bautizo de NOAH</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PORTADA
    ========================== -->

    <main class="portada" id="portada">

        <!-- Decoración superior -->
        <div class="decoracion decoracion-superior izquierda">
            ✿
        </div>

        <div class="decoracion decoracion-superior derecha">
            ❀
        </div>

        <!-- Papel picado decorativo -->
        <div class="papel-picado">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- Contenido principal -->

        <div class="contenido-portada">

            <p class="texto-pequeno">
                BAUTIZO
            </p>

            <div class="ornamento">
                ───── ✿ ─────
            </div>

            <h1>
                NOAH
            </h1>

            <p class="fecha">
                16 · JUNIO · 2027
            </p>

            <div class="ornamento inferior">
                ❦
            </div>

            <p class="frase">
                Una celebración llena<br>
                de amor
            </p>

            <button
                class="boton-abrir"
                id="botonAbrir">
                Abrir invitación
            </button>

        </div>


        <!-- Decoraciones inferiores -->

        <div class="decoracion inferior-izquierda">
            🌿
        </div>

        <div class="decoracion inferior-derecha">
            🌵
        </div>

        <div class="flor flor-1">✿</div>
        <div class="flor flor-2">❀</div>
        <div class="flor flor-3">✿</div>


        <!-- Indicador inferior -->

        <div class="indicador">
            <span>Descubre la celebración</span>
            <div class="flecha">↓</div>
        </div>

    </main>


    <!-- =========================
         CONTENIDO TEMPORAL
         Lo sustituiremos después
    ========================== -->

    <section class="contenido-prueba">

        <p>Bienvenidos a la celebración de NOAH 🤍</p>

    </section>


    <!-- Música -->
    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
